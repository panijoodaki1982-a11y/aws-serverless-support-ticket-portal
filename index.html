<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Support Ticket Portal</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
.wrap{max-width:760px;margin:55px auto;padding:22px}
.card{background:white;border-radius:18px;padding:30px;box-shadow:0 12px 35px #0001}
h1{margin:0 0 8px;color:#232f3e} .sub{color:#657084;margin-bottom:26px}
label{display:block;font-weight:700;margin:16px 0 7px}
input,textarea{width:100%;padding:13px;border:1px solid #ccd4df;border-radius:9px;font:inherit}
textarea{min-height:130px;resize:vertical}
button{margin-top:20px;background:#ff9900;border:0;border-radius:9px;padding:13px 22px;font-weight:700;cursor:pointer}
#msg{margin-top:18px;padding:12px;border-radius:9px;display:none;background:#eef3f8}
.small{margin-top:24px;color:#7a8493;font-size:13px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>☁️ Cloud Support Ticket Portal</h1>
<div class="sub">AWS serverless support application</div>
<form id="ticketForm">
<label>Name</label><input id="name" required placeholder="Your name">
<label>Email</label><input id="email" type="email" required placeholder="you@example.com">
<label>Issue</label><textarea id="issue" required placeholder="Describe your support issue..."></textarea>
<button type="submit">Create Support Ticket</button>
</form>
<div id="msg"></div>
<div class="small">Built with Amazon S3 • API Gateway • AWS Lambda</div>
</div></div>
<script>
const API = "https://YOUR_API_ID.execute-api.eu-west-3.amazonaws.com";
const form=document.getElementById("ticketForm"), msg=document.getElementById("msg");
form.addEventListener("submit",async(e)=>{
 e.preventDefault(); msg.style.display="block"; msg.textContent="Submitting...";
 try{
  const r=await fetch(API+"/tickets",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name:document.getElementById("name").value,email:document.getElementById("email").value,issue:document.getElementById("issue").value})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.message||"Request failed");
  msg.textContent="✅ Ticket created successfully!";
  form.reset();
 }catch(err){msg.textContent="❌ "+err.message;}
});
</script>
</body></html>
